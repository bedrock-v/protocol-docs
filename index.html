1' fill='%236c4c35'/><rect x='9' y='15' width='1' height='1' fill='%2379553a'/><rect x='10' y='15' width='3' height='1' fill='%23593d29'/><rect x='14' y='15' width='1' height='1' fill='%236c4c35'/></svg>");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow-x: clip; }
  body {
    color: var(--mc-text);
    font: 16px/1.45 var(--font-ui);
    display: flex; flex-direction: column; height: 100vh;
    /* the options screen background: tiled dirt, darkened */
    background: linear-gradient(var(--mc-dirt-dim), var(--mc-dirt-dim)), var(--dirt) 0 0 / 64px 64px;
    background-color: var(--mc-slot-lo);
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
  }
  a { color: var(--mc-link); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: var(--px); }
  :focus-visible { outline: var(--px) solid var(--mc-text); outline-offset: var(--px); }
  code { font-family: var(--font-mono); font-size: 20px; line-height: 1; }

  /* bevels: light top-left, dark bottom-right, hard black rim. that's 90% of the look */
  .gui {
    background: var(--mc-panel); color: var(--mc-ink);
    border: var(--px) solid var(--mc-edge);
    box-shadow: inset var(--px) var(--px) 0 var(--mc-panel-hi), inset calc(var(--px) * -2) calc(var(--px) * -2) 0 var(--mc-panel-lo);
  }
  .slot {
    background: var(--mc-slot);
    box-shadow: inset var(--px) var(--px) 0 var(--mc-slot-lo), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--mc-slot-hi);
  }

  header {
    display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap;
    padding: var(--space-md) var(--space-lg); flex-shrink: 0;
    background: rgba(0, 0, 0, .35);
    border-bottom: var(--px) solid var(--mc-edge);
  }
  .brand { position: relative; display: flex; flex-direction: column; line-height: 1; white-space: nowrap; margin-right: 56px; }
  .brand-word {
    font-weight: 700; font-size: 26px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--mc-text-dim); text-shadow: 3px 3px 0 var(--mc-shadow);
  }
  .brand-sub { font-size: 13px; color: var(--c-gray); text-shadow: var(--px) var(--px) 0 var(--mc-shadow); margin-top: var(--space-2xs); letter-spacing: .08em; }
  .splash {
    position: absolute; right: -62px; top: 30px; white-space: nowrap; pointer-events: none;
    font-size: 13px; color: var(--c-splash); text-shadow: var(--px) var(--px) 0 var(--c-splash-shadow);
    transform: rotate(-16deg); transform-origin: center;
    animation: splash .55s var(--ease-in-out) infinite alternate;
  }
  @keyframes splash { from { transform: rotate(-16deg) scale(.94); } to { transform: rotate(-16deg) scale(1.06); } }

  .mc-field, header select, header input, .diff-head select {
    background: var(--mc-field); color: var(--mc-text-dim);
    border: var(--px) solid var(--mc-field-edge); border-radius: 0;
    padding: var(--space-xs) var(--space-sm); font: 18px/1 var(--font-mono);
    outline: none; min-width: 0;
  }
  .mc-field:hover { border-color: var(--mc-text-dim); }
  .mc-field:focus, .diff-head select:focus { border-color: var(--mc-text); }
  .mc-field::placeholder { color: var(--c-gray); }
  header select { max-width: 340px; cursor: pointer; }
  header input.mc-field { flex: 1; min-width: 160px; }

  .mc-btn {
    font: 500 16px/1 var(--font-ui); color: var(--mc-text-dim); cursor: pointer; white-space: nowrap;
    padding: var(--space-sm) var(--space-lg);
    background: var(--mc-btn); border: var(--px) solid var(--mc-edge); border-radius: 0;
    box-shadow: inset var(--px) var(--px) 0 var(--mc-btn-hi), inset calc(var(--px) * -1) calc(var(--px) * -2) 0 var(--mc-btn-lo);
    text-shadow: var(--px) var(--px) 0 var(--mc-shadow);
  }
  .mc-btn:hover { background: var(--mc-btn-hover); color: var(--c-yellow); box-shadow: inset var(--px) var(--px) 0 var(--mc-btn-hover-hi), inset calc(var(--px) * -1) calc(var(--px) * -2) 0 var(--mc-btn-hover-lo); }
  .mc-btn:active { box-shadow: inset var(--px) var(--px) 0 var(--mc-btn-lo), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--mc-btn-hi); }
  .mc-btn:disabled { background: var(--mc-slot-lo); color: var(--c-gray); box-shadow: none; text-shadow: none; cursor: default; }
  /* bedrock style green when the diff view is on */
  .mc-btn.active { background: var(--mc-green); color: var(--mc-text); box-shadow: inset var(--px) var(--px) 0 var(--mc-green-hi), inset calc(var(--px) * -1) calc(var(--px) * -2) 0 var(--mc-green-lo); }
  .mc-btn.menu { display: none; padding: var(--space-sm) var(--space-md); }

  .badges { display: flex; gap: var(--space-xs); white-space: nowrap; overflow-x: auto; max-width: 100%; }
  .badge {
    background: var(--mc-chat-bg); color: var(--c-gray);
    padding: var(--space-2xs) var(--space-sm); font: 18px/1 var(--font-mono);
  }
  .badge b { color: var(--c-gold); font-weight: 400; }

  .main { display: flex; flex: 1; min-height: 0; gap: var(--space-md); padding: var(--space-md); }
  aside { width: 310px; flex-shrink: 0; overflow-y: auto; padding: var(--space-sm) var(--space-xs) var(--space-md); }
  .group-title {
    padding: var(--space-md) var(--space-sm) var(--space-xs); color: var(--mc-ink);
    font-size: 16px; font-weight: 600; display: flex; justify-content: space-between;
  }
  .group-title span:last-child { font: 18px/1 var(--font-mono); color: var(--mc-ink-soft); }
  .item {
    text-decoration: none !important;
    position: relative; padding: var(--space-xs) var(--space-sm); cursor: pointer;
    display: flex; align-items: center; gap: var(--space-sm); font-size: 15px; color: var(--mc-ink);
    border: var(--px) solid transparent;
  }
  /* slot hover: the translucent white wash you get over an item */
  .item:hover { background: rgba(255, 255, 255, .45); }
  .item.active {
    background: var(--mc-slot); color: var(--mc-text); text-shadow: var(--px) var(--px) 0 var(--mc-shadow);
    box-shadow: inset var(--px) var(--px) 0 var(--mc-slot-lo), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--mc-slot-hi);
  }
  /* ids look like a stack count in the corner of a slot */
  .item .id { margin-left: auto; font: 20px/1 var(--font-mono); color: var(--mc-text); text-shadow: var(--px) var(--px) 0 var(--mc-shadow); }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .item.cursor { outline: var(--px) solid var(--mc-ink); outline-offset: calc(var(--px) * -1); }
  .item .hint { display: block; font: 16px/1 var(--font-mono); color: var(--mc-ink-soft); text-shadow: none; }
  .dir { font: 16px/1 var(--font-mono); padding: 1px var(--space-2xs); background: var(--mc-slot-lo); text-shadow: var(--px) var(--px) 0 var(--mc-edge); white-space: nowrap; }
  .item .dir { margin-left: auto; }
  .item .dir + .id { margin-left: 0; }
  .dir-serverbound { color: var(--c-aqua); }
  .dir-clientbound { color: var(--c-gold); }
  .dir-both { color: var(--c-purple); }
  .badge.dir-serverbound, .badge.dir-clientbound, .badge.dir-both { background: var(--mc-slot-lo); }

  main { flex: 1; min-width: 0; overflow-y: auto; padding: var(--space-xl) var(--space-2xl); }
  .empty { color: var(--mc-ink-soft); text-align: center; margin-top: 80px; font-size: 18px; }
  h1 { font-size: 30px; font-weight: 700; margin: 0; color: var(--mc-ink); overflow-wrap: anywhere; min-width: 0; line-height: 1.1; }
  .kindrow { display: flex; align-items: center; gap: var(--space-md); margin-bottom: var(--space-lg); flex-wrap: wrap; }
  .kind {
    font: 18px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em;
    padding: var(--space-2xs) var(--space-sm); background: var(--mc-slot-lo);
    text-shadow: var(--px) var(--px) 0 var(--mc-edge);
  }
  .kind.packet { color: var(--c-green); }
  .kind.struct { color: var(--c-aqua); }
  .kind.enum { color: var(--c-gold); }
  .kind.alias { color: var(--c-purple); }
  .kindrow .badge { background: var(--mc-slot-lo); }

  /* descriptions read like item lore, so they get the purple tooltip frame */
  .desc {
    color: var(--mc-text-dim); background: var(--mc-tip-bg); margin: 0 0 var(--space-xl); max-width: 780px;
    padding: var(--space-sm) var(--space-md); font: 20px/1.25 var(--font-mono);
    border: var(--px) solid var(--mc-tip-bg);
    box-shadow: inset 0 0 0 var(--px) var(--mc-tip-a), inset 0 calc(var(--px) * -2) 0 var(--px) var(--mc-tip-b);
    text-shadow: var(--px) var(--px) 0 var(--mc-shadow);
  }
  .desc a { color: var(--c-aqua); }

  .table-wrap { max-width: 920px; overflow-x: auto; padding: var(--px); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: var(--space-sm) var(--space-md); border-bottom: var(--px) solid var(--mc-slot); font-size: 15px; }
  th { background: var(--mc-slot-lo); color: var(--mc-text-dim); font-weight: 500; text-shadow: var(--px) var(--px) 0 var(--mc-edge); }
  tbody tr:hover td { background: rgba(255, 255, 255, .35); }
  td:first-child { font: 20px/1 var(--font-mono); color: var(--mc-ink-soft); width: 1%; }
  td.type code { color: var(--mc-ink); }
  td.type a code { color: var(--mc-link); }
  .opt-yes { color: var(--mc-ink-soft); }
  .sub { font: 17px/1.15 var(--font-mono); color: var(--mc-ink-soft); margin-top: 2px; }
  .muted { color: var(--mc-ink-soft); font-weight: 400; }
  .variants div + div { margin-top: 2px; }
  .expand {
    font: 16px/1 var(--font-mono); width: 20px; height: 20px; padding: 0; margin-right: var(--space-xs); cursor: pointer;
    color: var(--mc-text); background: var(--mc-btn); border: var(--px) solid var(--mc-edge); vertical-align: middle;
    box-shadow: inset var(--px) var(--px) 0 var(--mc-btn-hi), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--mc-btn-lo);
  }
  .expand:hover { background: var(--mc-btn-hover); }
  tr.nested > td { background: var(--mc-slot); padding: var(--space-sm); }
  tbody tr.nested:hover td { background: var(--mc-slot); }
  .nested-title { font-weight: 600; color: var(--mc-text); text-shadow: var(--px) var(--px) 0 var(--mc-shadow); margin-bottom: var(--space-xs); }
  table.inline { background: var(--mc-panel); }
  table.inline th, table.inline td { padding: var(--space-2xs) var(--space-sm); font-size: 14px; }
  .toolrow { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; margin: 0 0 var(--space-lg); }
  .mc-btn.small { font-size: 14px; padding: var(--space-xs) var(--space-md); }
  .val.link { text-decoration: none; }
  .val.link:hover { background: var(--mc-btn-hover); }
  .history { list-style: none; padding: 0; margin: 0; font: 20px/1.3 var(--font-mono); color: var(--mc-ink); }
  .h-added { color: var(--mc-req); } .h-removed { color: #a00000; } .h-changed { color: #8a6d00; }
  .decoder { margin-top: var(--space-2xl); max-width: 920px; }
  .decoder summary { cursor: pointer; font-size: 18px; font-weight: 600; color: var(--mc-ink); }
  .decoder textarea { width: 100%; display: block; margin: var(--space-sm) 0; resize: vertical; }
  .check { display: block; margin-bottom: var(--space-sm); font: 18px/1.2 var(--font-mono); }
  .err { color: #a00000; font: 20px/1.2 var(--font-mono); }
  .ok, .ok-ink { color: var(--mc-req); font: 20px/1.2 var(--font-mono); }
  .proto { font: 20px/1 var(--font-mono); color: var(--mc-ink-soft); margin: 0 0 var(--space-md); }
  .proto b { color: var(--mc-ink); font-weight: 400; }
  .empty-inline { color: var(--mc-ink-soft); }
  a.badge { text-decoration: none; }
  a.badge:hover { background: var(--mc-btn-hover); }
  .opt-no { color: var(--mc-req); font-weight: 600; }
  .ser { color: var(--mc-ink-soft); font: 18px/1.1 var(--font-mono); }

  .vals { display: flex; flex-wrap: wrap; gap: var(--space-xs); max-width: 920px; }
  .val {
    background: var(--mc-chip); color: var(--mc-text); padding: var(--space-2xs) var(--space-sm);
    font: 20px/1 var(--font-mono); text-shadow: var(--px) var(--px) 0 var(--mc-shadow);
    box-shadow: inset var(--px) var(--px) 0 var(--mc-slot-lo), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--mc-slot-hi);
  }

  .schema-h { font-size: 18px; font-weight: 600; color: var(--mc-ink); margin: var(--space-2xl) 0 var(--space-sm); }
  .mermaid { padding: var(--space-lg); overflow-x: auto; background: var(--mc-slot);
    box-shadow: inset var(--px) var(--px) 0 var(--mc-slot-lo), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--mc-slot-hi); }

  /* diff view is basically a chat log */
  .diff-head { display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap; margin-bottom: var(--space-xl); }
  .diff-head .arrow { color: var(--mc-ink-soft); font: 20px/1 var(--font-mono); }
  .diff-cat { font-size: 18px; font-weight: 600; color: var(--mc-ink); margin: var(--space-xl) 0 var(--space-sm); }
  .d-add, .d-rem, .d-chg {
    padding: var(--space-xs) var(--space-md); margin: 0; max-width: 920px;
    background: var(--mc-chat-bg); color: var(--mc-text); font: 20px/1.2 var(--font-mono);
    text-shadow: var(--px) var(--px) 0 var(--mc-edge); border-left: calc(var(--px) * 2) solid;
  }
  .d-add + .d-add, .d-add + .d-rem, .d-add + .d-chg, .d-rem + .d-add, .d-rem + .d-rem,
  .d-rem + .d-chg, .d-chg + .d-add, .d-chg + .d-rem, .d-chg + .d-chg { margin-top: var(--px); }
  .d-add { border-color: var(--c-green); }
  .d-rem { border-color: var(--c-red); }
  .d-chg { border-color: var(--c-yellow); }
  .d-add a, .d-chg a { color: var(--c-aqua); }
  .d-sub { margin: var(--px) 0 var(--px) var(--space-xl); font: 18px/1.2 var(--font-mono); }
  .d-sub.add { color: var(--c-green); }
  .d-sub.rem { color: var(--c-red); }
  .d-sub.chg { color: var(--c-yellow); }
  .tag { color: var(--c-gray); }
  .diff-sum { display: inline-flex; gap: var(--space-lg); flex-wrap: wrap; padding: var(--space-xs) var(--space-md); background: var(--mc-chat-bg); }
  .diff-sum .d-sub { margin: 0; text-shadow: var(--px) var(--px) 0 var(--mc-edge); }
  .diff-sum span b { color: var(--mc-text); font-weight: 400; }

  /* chunky gui scrollbars */
  * { scrollbar-color: var(--mc-panel) var(--mc-slot-lo); }
  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-track { background: var(--mc-slot-lo); }
  ::-webkit-scrollbar-thumb { background: var(--mc-panel); border: var(--px) solid var(--mc-edge); box-shadow: inset var(--px) var(--px) 0 var(--mc-panel-hi), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--mc-panel-lo); }

  @media (max-width: 700px) {
    header { padding: var(--space-sm) var(--space-lg); gap: var(--space-sm); }
    .mc-btn.menu { display: inline-block; }
    .splash { display: none; }
    .brand { margin-right: 0; }
    #idsBtn { margin-left: auto; }
    header .mc-btn { font-size: 14px; padding: var(--space-xs) var(--space-sm); }
    header { padding: var(--space-sm) var(--space-md); }
    header select { flex-basis: 100%; max-width: none; order: 3; }
    header input.mc-field { flex-basis: 100%; order: 4; }
    .badges { order: 5; }
    .main { padding: var(--space-sm); }
    aside {
      position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; width: min(310px, 86vw);
      transform: translateX(-105%); transition: transform .22s var(--ease-out);
    }
    aside.open { transform: none; }
    main { padding: var(--space-lg); }
    h1 { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .splash { animation: none; }
    aside { transition: opacity .15s linear; }
  }
</style>
</head>
<body>
<header>
  <button id="menuBtn" class="mc-btn menu" aria-controls="sidebar" aria-expanded="false">List</button>
  <div class="brand">
    <span class="brand-word">Bedrock</span>
    <span class="brand-sub">Protocol Docs</span>
    <span class="splash" id="splash" aria-hidden="true"></span>
  </div>
  <select id="version" class="mc-field" title="version"></select>
  <input id="search" class="mc-field" type="search" placeholder="Search packets, types, enums...">
  <button id="idsBtn" class="mc-btn">IDs</button>
  <button id="diffBtn" class="mc-btn diffbtn">Changes</button>
  <div class="badges" id="badges"></div>
</header>
<div class="main">
  <aside id="sidebar" class="gui"></aside>
  <main id="content" class="gui"><div class="empty">Loading...</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
const hasMermaid = typeof mermaid !== 'undefined';
if (hasMermaid) mermaid.initialize({
  startOnLoad: false, theme: 'base', securityLevel: 'loose',
  // match the slot / button greys so diagrams don't look pasted in from another app
  themeVariables: {
    fontFamily: 'VT323, monospace', fontSize: '18px',
    primaryColor: '#707070', primaryTextColor: '#ffffff', primaryBorderColor: '#000000',
    lineColor: '#373737', edgeLabelBackground: '#c6c6c6', tertiaryColor: '#c6c6c6',
    textColor: '#404040'
  }
});

const CATS = [['Packets', 'packets'], ['Types', 'types'], ['Enums', 'enums']];
const state = {
  data: null, slug: null, index: new Map(), usedBy: new Map(), current: null,
  versions: [], view: 'browse', baseSlug: null, cache: new Map(),
  history: null, dirs: null, cursor: -1
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;
const itemHref = name => `#${state.slug}/${enc(name)}`;

async function fetchJson(url) {
  try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; }
}

// older builds filed every schema with "Packet" in its name under packets, anything without a
// packet id is really just a struct so move it back where it belongs
function normalize(data) {
  if (!data || data._normalized) return data;
  const real = [], moved = [];
  for (const o of data.packets || []) {
    if (o && o.id == null) moved.push({ ...o, kind: o.fields ? 'struct' : o.kind === 'packet' ? 'alias' : o.kind });
    else real.push(o);
  }
  data.packets = real;
  data.types = [...(data.types || []), ...moved];
  data._normalized = true;
  return data;
}

// one json per build now, cached so the diff view doesn't refetch the base every render
function getData(slug) {
  if (window.__DOCS__) return Promise.resolve(normalize(window.__DOCS__.data[slug] || null));
  if (!state.cache.has(slug)) state.cache.set(slug, fetchJson(`./data/${slug}.json`).then(normalize));
  return state.cache.get(slug);
}

// "(anonymous namespace)::Foo::Bar" is noise in a list, keep the full name in the tooltip
const displayName = n => String(n).replace(/^\(anonymous[ _]namespace\)(::|__)/, '').replace(/__/g, '::');

// a type is "unresolved" if it contains 'unknown' (stale pre-fix data, e.g. unknown, unknown[])
const isUnknown = t => typeof t === 'string' && t.includes('unknown');
const baseType = t => String(t).replace(/\[\]$/, '');

function itemDiff(a, b) {
  if (a.fields || b.fields) {
    const am = new Map((a.fields || []).map(f => [f.name, f]));
    const bm = new Map((b.fields || []).map(f => [f.name, f]));
    const addedF = [], removedF = [], changedF = [];
    for (const [n, f] of bm) if (!am.has(n)) addedF.push(f);
    for (const [n, f] of am) if (!bm.has(n)) removedF.push(f);
    for (const [n, f] of bm) if (am.has(n)) {
      const g = am.get(n);
      // ignore type changes that only involve 'unknown' (stale pre-fix data, not a real change)
      const typeReal = g.type !== f.type && !isUnknown(g.type) && !isUnknown(f.type);
      const optCh = g.optional !== f.optional;
      const ordCh = g.order !== f.order;
      if (typeReal || optCh || ordCh)
        changedF.push({ name: n, from: g, to: f, typeReal, optCh, ordCh });
    }
    const idChg = (a.id !== b.id);
    if (!addedF.length && !removedF.length && !changedF.length && !idChg) return null;
    return { type: 'fields', addedF, removedF, changedF, idChg, oldId: a.id, newId: b.id };
  }
  if (a.values || b.values) {
    const as = new Set(a.values || []), bs = new Set(b.values || []);
    const addedV = [...bs].filter(v => !as.has(v));
    const removedV = [...as].filter(v => !bs.has(v));
    if (!addedV.length && !removedV.length) return null;
    return { type: 'values', addedV, removedV };
  }
  return JSON.stringify(a) !== JSON.stringify(b) ? { type: 'other' } : null;
}

function diffVersions(oldData, newData) {
  const out = {};
  for (const [, cat] of CATS) {
    const oldMap = new Map((oldData[cat] || []).map(o => [o.name, o]));
    const newMap = new Map((newData[cat] || []).map(o => [o.name, o]));
    const added = [], removed = [], changed = [];
    for (const [n] of newMap) if (!oldMap.has(n)) added.push(n);
    for (const [n] of oldMap) if (!newMap.has(n)) removed.push(n);
    for (const [n, o] of newMap) if (oldMap.has(n)) {
      const fd = itemDiff(oldMap.get(n), o);
      if (fd) changed.push({ name: n, ...fd });
    }
    out[cat] = { added, removed, changed };
  }
  return out;
}

// ---- direction & wire format -------------------------------------------------

const DIR_LABEL = { serverbound: 'C→S', clientbound: 'S→C', both: 'both ways' };
const DIR_ALIAS = { cs: 'serverbound', c2s: 'serverbound', serverbound: 'serverbound', sc: 'clientbound',
  s2c: 'clientbound', clientbound: 'clientbound', both: 'both' };

function directionOf(o) {
  if (!state.dirs || (o.kind || '') !== 'packet') return null;
  if (state.dirs.both.has(o.name)) return 'both';
  if (state.dirs.serverbound.has(o.name) || /^(Serverbound|ClientToServer)/.test(o.name)) return 'serverbound';
  // ok so anything the server never handles is assumed to be sent by it
  return 'clientbound';
}

const INT_BYTES = { int8: 1, uint8: 1, int16: 2, uint16: 2, int32: 4, uint32: 4, int64: 8, uint64: 8 };

// cereal's "Compression" flag is varint encoding, signed ints get zigzag on top like the rest of bedrock
function scalarWire(t, opts) {
  const varint = opts.includes('Compression'), be = opts.includes('Big Endian');
  if (t === 'boolean' || t === 'bool') return 'bool (1 byte)';
  if (t === 'string') return opts.includes('No size compression') ? 'uint32 len + utf8' : 'varuint32 len + utf8';
  if (t === 'float') return `float32 ${be ? 'BE' : 'LE'}`;
  if (t === 'double') return `float64 ${be ? 'BE' : 'LE'}`;
  const n = INT_BYTES[t];
  if (!n) return null;
  if (varint && n >= 4) return `${t.startsWith('u') ? 'varuint' : 'zigzag varint'}${n * 8}`;
  return n === 1 ? t : `${t} ${be ? 'BE' : 'LE'}`;
}

function wireOf(f) {
  const opts = f.serialization || [];
  if (f.variants) return `variant, ${f.controlType || '?'} selector`;
  if (String(f.type).endsWith('[]')) {
    const count = opts.includes('No size compression') ? 'uint32' : 'varuint32';
    const inner = scalarWire(f.underlyingType || baseType(f.type), opts);
    return `${count} count + ${inner || 'items'}`;
  }
  const t = f.underlyingType || f.type;
  const w = scalarWire(t, opts);
  if (w) return w;
  const ref = state.index.get(f.type);
  if (ref && ref.obj.kind === 'enum' && ref.obj.underlyingType) return scalarWire(ref.obj.underlyingType, opts);
  return null;
}

function constraintText(f) {
  const c = f.constraints || {}, out = [];
  if (c.minimum != null || c.maximum != null) out.push(`${c.minimum ?? '…'}..${c.maximum ?? '…'}`);
  if (c.minLength != null) out.push(`len ≥ ${c.minLength}`);
  if (c.maxLength != null) out.push(`len ≤ ${c.maxLength}`);
  if (c.minItems != null) out.push(`items ≥ ${c.minItems}`);
  if (c.maxItems != null) out.push(`items ≤ ${c.maxItems}`);
  if (c.pattern) out.push(`/${c.pattern}/`);
  if (f.const != null) out.push(`= ${JSON.stringify(f.const)}`);
  if (f.default != null && f.default !== '') out.push(`default ${JSON.stringify(f.default)}`);
  return out;
}

// ---- data loading ------------------------------------------------------------

function buildUsedBy() {
  state.usedBy.clear();
  const add = (t, from) => {
    const b = baseType(t);
    if (!state.usedBy.has(b)) state.usedBy.set(b, new Set());
    state.usedBy.get(b).add(from);
  };
  for (const [name, { obj }] of state.index) {
    for (const f of obj.fields || []) {
      for (const v of f.variants || []) add(v, name);
      String(f.type).split(' | ').forEach(t => add(t, name));
    }
    if (obj.type) add(obj.type, name);
  }
}

async function loadVersions() {
  const [versions, dirs, history] = await Promise.all([
    window.__DOCS__ ? window.__DOCS__.versions : fetchJson('./versions.json'),
    fetchJson('./directions.json'),
    fetchJson('./history.json')
  ]);
  if (dirs) state.dirs = { serverbound: new Set(dirs.serverbound), both: new Set(dirs.both) };
  state.history = history;
  if (!versions || !versions.length) {
    $('content').innerHTML = '<div class="empty">No versions found.</div>';
    return;
  }
  state.versions = versions;
  const sel = $('version');
  sel.innerHTML = versions.map(v =>
    `<option value="${esc(v.slug)}">${esc(v.version)}${v.update ? ' · ' + esc(v.update) : ''} (mc ${esc(v.minecraftVersion)})</option>`).join('');
  // keep whatever view you're in when hopping versions
  sel.onchange = () => {
    const r = parseHash();
    const rest = r.view === 'item' && r.arg ? enc(r.arg) : r.view !== 'browse' ? '@' + r.view : '';
    location.hash = `${sel.value}${rest ? '/' + rest : ''}`;
  };
  route();
}

async function loadData(slug) {
  $('content').innerHTML = '<div class="empty">Loading terrain...</div>';
  const data = await getData(slug);
  if (!data) { $('content').innerHTML = '<div class="empty">Could not load this build.</div>'; return false; }
  state.data = data; state.slug = slug; state.index.clear();
  for (const [, cat] of CATS)
    for (const o of (data[cat] || [])) if (o && o.name) state.index.set(o.name, { cat, obj: o });
  buildUsedBy();
  $('version').value = slug;
  const rep = report(data);
  const raw = window.__DOCS__ ? '' : `<a class="badge" href="./data/${esc(slug)}.json" download title="whole build as json">json</a>`;
  $('badges').innerHTML =
    (data.update ? `<span class="badge">update <b>${esc(data.update)}</b></span>` : '') +
    `<span class="badge">build <b>${esc(data.version)}</b></span>` +
    `<span class="badge">protocol <b>${esc(data.protocolVersion)}</b></span>` +
    `<span class="badge">mc <b>${esc(data.minecraftVersion)}</b></span>` +
    `<a class="badge" href="#${esc(slug)}/@report" title="resolved field types">coverage <b>${rep.coverage}%</b></a>` + raw;
  renderSidebar();
  return true;
}

// ---- routing -----------------------------------------------------------------
// #<slug>, #<slug>/<item>, #<slug>/@diff[/<base>], #<slug>/@ids, #<slug>/@report

function parseHash() {
  const h = location.hash.replace(/^#/, '');
  const i = h.indexOf('/');
  const slug = i < 0 ? h : h.slice(0, i);
  const rest = i < 0 ? '' : h.slice(i + 1);
  if (rest.startsWith('@')) {
    const [view, ...arg] = rest.slice(1).split('/');
    return { slug, view, arg: arg.join('/') };
  }
  return { slug, view: rest ? 'item' : 'browse', arg: rest ? decodeURIComponent(rest) : '' };
}

let routing = Promise.resolve();
function route() { routing = routing.then(doRoute); return routing; }

async function doRoute() {
  const r = parseHash();
  const known = state.versions.find(v => v.slug === r.slug);
  const slug = known ? r.slug : state.versions[0].slug;
  if (slug !== state.slug && !(await loadData(slug))) return;
  state.view = r.view;
  $('diffBtn').classList.toggle('active', r.view === 'diff');
  $('idsBtn').classList.toggle('active', r.view === 'ids');
  if (r.view === 'diff') { state.baseSlug = r.arg || null; return renderDiff(); }
  if (r.view === 'ids') return renderIds();
  if (r.view === 'report') return renderReport();
  if (r.view === 'item' && state.index.has(r.arg)) return select(r.arg);
  clearDetail();
}

// ---- sidebar & search ----------------------------------------------------------

function parseQuery(raw) {
  const q = { text: '', id: null, type: null, kind: null, dir: null };
  const words = [];
  for (const tok of raw.trim().split(/\s+/).filter(Boolean)) {
    const m = tok.match(/^(id|type|kind|dir):(.*)$/i);
    if (!m) { words.push(tok.toLowerCase()); continue; }
    const k = m[1].toLowerCase(), v = m[2].toLowerCase();
    if (k === 'id') q.id = v.startsWith('0x') ? parseInt(v, 16) : parseInt(v, 10);
    else if (k === 'dir') q.dir = DIR_ALIAS[v] || v;
    else q[k] = v;
  }
  q.text = words.join(' ');
  return q;
}

// substring beats subsequence, name beats field names beats descriptions
function fuzzy(hay, needle) {
  hay = hay.toLowerCase();
  const i = hay.indexOf(needle);
  if (i >= 0) return 1000 - i;
  // subsequence only counts when the letters sit close together, otherwise long names match everything
  let j = 0, first = -1, last = -1;
  for (let k = 0; k < hay.length && j < needle.length; k++)
    if (hay[k] === needle[j]) { if (first < 0) first = k; last = k; j++; }
  return j === needle.length && last - first < needle.length * 2 ? 300 - hay.length : 0;
}

function matchItem(o, q) {
  if (q.id != null && o.id !== q.id) return null;
  if (q.kind && !(o.kind || '').startsWith(q.kind)) return null;
  if (q.dir && directionOf(o) !== q.dir) return null;
  if (q.type) {
    const hit = (o.fields || []).some(f =>
      [f.type, ...(f.variants || [])].some(t => baseType(t).toLowerCase().includes(q.type)));
    if (!hit && !(o.type && o.type.toLowerCase().includes(q.type))) return null;
  }
  if (!q.text) return { score: 1, hint: '' };
  const s = fuzzy(o.name, q.text.replace(/\s+/g, ''));
  if (s) return { score: s + 2000, hint: '' };
  const f = (o.fields || []).find(f => f.name.toLowerCase().includes(q.text));
  if (f) return { score: 500, hint: `field: ${f.name}` };
  const v = (o.values || []).find(v => String(v).toLowerCase().includes(q.text));
  if (v) return { score: 400, hint: `value: ${v}` };
  if ((o.description || '').toLowerCase().includes(q.text)) return { score: 100, hint: 'in description' };
  return null;
}

function renderSidebar() {
  const raw = $('search').value;
  const q = parseQuery(raw);
  const filtering = !!raw.trim();
  let html = '';
  for (const [label, cat] of CATS) {
    let list = [];
    for (const o of (state.data[cat] || [])) {
      if (!o || !o.name) continue;
      const m = matchItem(o, q);
      if (m) list.push({ o, ...m });
    }
    list.sort((a, b) => (filtering ? b.score - a.score : 0) || a.o.name.localeCompare(b.o.name));
    if (!list.length) continue;
    html += `<div class="group-title"><span>${label}</span><span>${list.length}</span></div>`;
    for (const { o, hint } of list) {
      const active = o.name === state.current ? ' active' : '';
      const dir = directionOf(o);
      const dirTag = dir ? `<span class="dir dir-${dir}" title="${dir}">${DIR_LABEL[dir]}</span>` : '';
      const id = (o.id != null) ? `<span class="id">${esc(o.id)}</span>` : '';
      html += `<a class="item${active}" href="${itemHref(o.name)}" data-name="${enc(o.name)}">` +
              `<span class="name" title="${esc(o.name)}">${esc(displayName(o.name))}${hint ? `<span class="hint">${esc(hint)}</span>` : ''}</span>` +
              `${dirTag}${id}</a>`;
    }
  }
  const side = $('sidebar');
  side.innerHTML = html || '<div class="empty" style="margin-top:20px">No matches</div>';
  state.cursor = -1;
}

function moveCursor(step) {
  const items = [...$('sidebar').querySelectorAll('.item')];
  if (!items.length) return;
  items.forEach(el => el.classList.remove('cursor'));
  state.cursor = Math.max(0, Math.min(items.length - 1, state.cursor + step));
  const el = items[state.cursor];
  el.classList.add('cursor');
  el.scrollIntoView({ block: 'nearest' });
}

// ---- item page -----------------------------------------------------------------

function typeLink(t) {
  const base = baseType(t), arr = t.endsWith('[]') ? '[]' : '';
  if (!state.index.has(base)) return `<code>${esc(t)}</code>`;
  const k = state.index.get(base).obj.kind;
  const expand = (k === 'struct' || k === 'enum' || k === 'alias')
    ? `<button class="expand" data-type="${esc(base)}" aria-expanded="false" title="show inline">+</button>` : '';
  return `${expand}<a href="${itemHref(base)}"><code>${esc(base)}</code></a>${arr}`;
}

function typeCell(f) {
  if (f.variants && f.variants.length)
    return `<div class="variants">${f.variants.map(v => `<div>${typeLink(v)}</div>`).join('')}</div>` +
           `<div class="sub">one of, picked by ${esc(f.controlType || 'a control value')}</div>`;
  return typeLink(f.type);
}

function fieldsTable(fields, nested) {
  let html = `<div class="table-wrap"><table${nested ? ' class="inline"' : ''}><thead><tr><th>#</th><th>Name</th><th>Type</th><th>Wire</th>` +
             (nested ? '' : '<th>Optional</th><th>Limits</th>') + `</tr></thead><tbody>`;
  for (const f of fields) {
    const wire = wireOf(f);
    const rawOpts = (f.serialization || []).join(', ');
    html += `<tr><td>${esc(f.order ?? '')}</td>` +
            `<td>${esc(f.name)}${!nested && f.description ? `<div class="sub">${esc(f.description)}</div>` : ''}</td>` +
            `<td class="type">${typeCell(f)}</td>` +
            `<td class="ser"${rawOpts ? ` title="cereal: ${esc(rawOpts)}"` : ''}>${wire ? esc(wire) : '<span class="muted">struct</span>'}</td>`;
    if (!nested) {
      const opt = f.optional ? '<span class="opt-yes">yes</span>' : '<span class="opt-no">no</span>';
      const lim = constraintText(f).map(esc).join('<br>');
      const rc = f.runtimeConstraint ? `<div class="sub">${esc(f.runtimeConstraint)}</div>` : '';
      html += `<td>${opt}</td><td class="ser">${lim}${rc}</td>`;
    }
    html += `</tr>`;
  }
  return html + `</tbody></table></div>`;
}

function enumTable(o) {
  const ids = o.valueIds || {}, docs = o.valueDocs || {};
  const hasIds = Object.keys(ids).length > 0;
  if (!hasIds && !Object.keys(docs).length)
    return `<div class="vals">${o.values.map(v => `<span class="val">${esc(v)}</span>`).join('')}</div>`;
  let html = `<div class="table-wrap"><table><thead><tr><th>Value</th><th>Hex</th><th>Name</th><th>Notes</th></tr></thead><tbody>`;
  for (const v of o.values) {
    const n = ids[v];
    const hex = typeof n === 'number' ? (n < 0 ? '-0x' + (-n).toString(16) : '0x' + n.toString(16)) : '';
    html += `<tr><td>${esc(n ?? '')}</td><td class="ser">${hex}</td><td><code>${esc(v)}</code></td>` +
            `<td class="ser">${esc(docs[v] || '')}</td></tr>`;
  }
  return html + `</tbody></table></div>`;
}

function inlineBody(name) {
  const e = state.index.get(name);
  if (!e) return '';
  const o = e.obj;
  if (o.fields) return fieldsTable(o.fields, true);
  if (o.values) return `<div class="vals">${o.values.slice(0, 80).map(v =>
    `<span class="val">${esc(v)}${o.valueIds && o.valueIds[v] != null ? ' = ' + esc(o.valueIds[v]) : ''}</span>`).join('')}` +
    (o.values.length > 80 ? `<span class="val">+${o.values.length - 80} more</span>` : '') + `</div>`;
  if (o.type) return `<p class="sub">alias of ${typeLink(o.type)}</p>`;
  return '';
}

function historyBlock(name) {
  const h = state.history && state.history[name];
  if (!h || !h.length) return '';
  const order = state.versions.map(v => v.slug);
  const rows = [...h].reverse().map(e => {
    const i = order.indexOf(e.slug);
    const prev = order[i + 1];
    const link = e.change !== 'added' && prev ? ` <a href="#${esc(e.slug)}/@diff/${esc(prev)}">diff</a>` : '';
    return `<li><span class="h-${e.change}">${e.change}</span> in <a href="#${esc(e.slug)}/${enc(name)}">${esc(e.version)}</a>${link}</li>`;
  });
  return `<h2 class="schema-h">History</h2><ul class="history">${rows.join('')}</ul>`;
}

function usedByBlock(name) {
  const set = state.usedBy.get(name);
  if (!set) return '';
  const names = [...set].filter(n => n !== name).sort();
  if (!names.length) return '';
  return `<h2 class="schema-h">Used by <span class="muted">${names.length}</span></h2><div class="vals">` +
    names.map(n => `<a class="val link" href="${itemHref(n)}">${esc(n)}</a>`).join('') + `</div>`;
}

function select(name) {
  const entry = state.index.get(name);
  if (!entry) return;
  state.current = name;
  renderSidebar();
  const o = entry.obj;
  const kind = o.kind || entry.cat;
  const dir = directionOf(o);
  let html = `<div class="kindrow"><h1 title="${esc(o.name)}">${esc(displayName(o.name))}</h1>` +
             `<span class="kind ${esc(kind)}">${esc(kind)}</span>`;
  if (o.id != null) html += `<span class="badge">id <b>${esc(o.id)}</b> <b>0x${Number(o.id).toString(16)}</b></span>`;
  if (dir) html += `<span class="badge dir-${dir}" title="derived from the server's packet handlers">${DIR_LABEL[dir]}</span>`;
  if (o.underlyingType) html += `<span class="badge">wire <b>${esc(o.underlyingType)}</b></span>`;
  html += `</div><div class="toolrow">` +
          `<button class="mc-btn small" id="jsonBtn">Download JSON</button>` +
          `<button class="mc-btn small" id="copyLinkBtn">Copy link</button></div>`;
  if (o.description) html += `<p class="desc">${esc(o.description)}</p>`;

  if (o.kind === 'enum' || o.values) html += enumTable(o);
  else if (o.fields) html += o.fields.length ? fieldsTable(o.fields, false) : '<p class="empty-inline">No fields.</p>';
  else if (o.type) html += `<p class="desc">Alias of ${typeLink(o.type)}</p>`;

  if (o.fields && o.fields.length && kind === 'packet') html += decoderBlock();
  html += usedByBlock(name) + historyBlock(name);

  const content = $('content');
  content.innerHTML = html;
  content.scrollTop = 0;
  $('jsonBtn').onclick = () => download(`${o.name}.json`, JSON.stringify(o, null, 2));
  $('copyLinkBtn').onclick = e => copy(location.href, e.target);
  const dec = $('decodeBtn');
  if (dec) dec.onclick = () => runDecoder(o);
  if (hasMermaid) {
    const wrap = document.createElement('div');
    wrap.innerHTML = '<h2 class="schema-h">Schema</h2>';
    const dia = document.createElement('div');
    dia.className = 'mermaid';
    dia.textContent = mermaidFor(o);
    wrap.appendChild(dia);
    content.appendChild(wrap);
    mermaid.run({ nodes: [dia] }).catch(() => { dia.textContent = 'diagram render failed'; });
  }
}

function mermaidFor(o) {
  const nid = s => String(s).replace(/[^A-Za-z0-9_]/g, '_');
  const lbl = s => String(s).replace(/"/g, "'");
  if (o.fields && o.fields.length) {
    let t = `flowchart LR\n  ROOT(["${lbl(o.name)}"])\n`;
    for (const f of o.fields) {
      const base = baseType(f.type);
      t += `  ROOT -->|"${lbl(f.name)}"| ${nid(base)}["${lbl(f.type)}"]\n`;
    }
    return t;
  }
  if (o.values) {
    let t = `flowchart TB\n  ROOT(["${lbl(o.name)}"])\n`;
    o.values.slice(0, 40).forEach(v => { t += `  ROOT --> ${nid(v)}["${lbl(v)}"]\n`; });
    if (o.values.length > 40) t += `  ROOT --> more["... ${o.values.length - 40} more"]\n`;
    return t;
  }
  if (o.type) {
    const base = baseType(o.type);
    return `flowchart LR\n  ROOT(["${lbl(o.name)}"]) -->|alias| ${nid(base)}["${lbl(o.type)}"]\n`;
  }
  return `flowchart LR\n  ROOT(["${lbl(o.name)}"])\n`;
}

// ---- byte decoder --------------------------------------------------------------

function decoderBlock() {
  return `<details class="decoder"><summary>Decode bytes</summary>` +
    `<p class="sub">Paste a hex dump of this packet. Experimental: optional fields are read as a bool ` +
    `presence flag and variants as an index into the list above, both are assumptions.</p>` +
    `<textarea id="hexIn" class="mc-field" rows="4" spellcheck="false" placeholder="09 00 01 ..."></textarea>` +
    `<label class="check"><input type="checkbox" id="hexHeader"> starts with the packet header varint</label>` +
    `<button class="mc-btn small" id="decodeBtn">Decode</button><div id="decodeOut"></div></details>`;
}

class Reader {
  constructor(bytes) { this.b = bytes; this.o = 0; this.dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength); }
  need(n) { if (this.o + n > this.b.length) throw new Error(`ran out of bytes at offset ${this.o} (needed ${n})`); }
  varuint(bits) {
    let r = 0n, shift = 0n;
    for (;;) {
      this.need(1);
      const x = this.b[this.o++];
      r |= BigInt(x & 0x7f) << shift;
      if (!(x & 0x80)) return r;
      shift += 7n;
      if (shift >= BigInt(bits + 7)) throw new Error(`varint too long at offset ${this.o}`);
    }
  }
  fixed(t, le) {
    const n = INT_BYTES[t] || (t === 'float' ? 4 : 8);
    this.need(n);
    const at = this.o; this.o += n;
    const dv = this.dv;
    switch (t) {
      case 'int8': return dv.getInt8(at);
      case 'uint8': return dv.getUint8(at);
      case 'int16': return dv.getInt16(at, le);
      case 'uint16': return dv.getUint16(at, le);
      case 'int32': return dv.getInt32(at, le);
      case 'uint32': return dv.getUint32(at, le);
      case 'int64': return dv.getBigInt64(at, le);
      case 'uint64': return dv.getBigUint64(at, le);
      case 'float': return dv.getFloat32(at, le);
      default: return dv.getFloat64(at, le);
    }
  }
}

function readScalar(r, t, opts) {
  const varint = opts.includes('Compression'), le = !opts.includes('Big Endian');
  if (t === 'boolean' || t === 'bool') { r.need(1); return r.b[r.o++] !== 0; }
  if (t === 'string') {
    const len = Number(opts.includes('No size compression') ? r.fixed('uint32', true) : r.varuint(32));
    r.need(len);
    const s = new TextDecoder().decode(r.b.subarray(r.o, r.o + len));
    r.o += len;
    return s;
  }
  if (t === 'float' || t === 'double') return r.fixed(t, le);
  const n = INT_BYTES[t];
  if (!n) return undefined;
  if (varint && n >= 4) {
    const v = r.varuint(n * 8);
    // zigzag for signed ones
    return t.startsWith('u') ? v : (v >> 1n) ^ -(v & 1n);
  }
  return r.fixed(t, le);
}

function decodeValue(r, f, path, rows, depth) {
  if (depth > 32) throw new Error('nesting too deep, probably a cycle');
  const opts = f.serialization || [];
  const start = r.o;
  const push = (val, wire) => rows.push({ off: start, len: r.o - start, path, wire, val });

  if (f.variants && f.variants.length) {
    const sel = Number(readScalar(r, f.controlType || 'uint32', opts) ?? 0);
    const pick = f.variants[sel];
    push(`${sel} → ${pick || '?'}`, `${f.controlType || '?'} selector`);
    if (!pick) throw new Error(`variant index ${sel} out of range at ${path}`);
    return decodeValue(r, { type: pick }, `${path}<${pick}>`, rows, depth + 1);
  }
  const t = String(f.type);
  if (t.endsWith('[]')) {
    const count = Number(opts.includes('No size compression') ? r.fixed('uint32', true) : r.varuint(32));
    push(count, 'count');
    if (count > 100000) throw new Error(`count ${count} at ${path} looks wrong`);
    for (let i = 0; i < count; i++)
      decodeValue(r, { ...f, type: baseType(t) }, `${path}[${i}]`, rows, depth + 1);
    return;
  }
  const scalarType = f.underlyingType || t;
  const v = readScalar(r, scalarType, opts);
  if (v !== undefined) {
    const ref = state.index.get(t);
    let shown = typeof v === 'string' ? JSON.stringify(v) : String(v);
    if (ref && ref.obj.valueIds) {
      const hit = Object.entries(ref.obj.valueIds).find(([, n]) => String(n) === String(v));
      if (hit) shown += ` (${hit[0]})`;
    }
    return push(shown, scalarWire(scalarType, opts));
  }
  const ref = state.index.get(t);
  if (!ref) throw new Error(`don't know how to read type ${t} at ${path}`);
  const o = ref.obj;
  if (o.values && o.underlyingType) {
    return decodeValue(r, { ...f, type: t, underlyingType: o.underlyingType }, path, rows, depth + 1);
  }
  if (o.type) return decodeValue(r, { ...f, type: o.type }, path, rows, depth + 1);
  if (o.fields) return decodeFields(r, o.fields, path, rows, depth + 1);
  throw new Error(`can't decode ${t} at ${path}`);
}

function decodeFields(r, fields, prefix, rows, depth) {
  for (const f of fields) {
    const path = prefix ? `${prefix}.${f.name}` : f.name;
    if (f.optional) {
      const at = r.o;
      r.need(1);
      const present = r.b[r.o++] !== 0;
      rows.push({ off: at, len: 1, path: `${path}?`, wire: 'bool (presence)', val: present });
      if (!present) continue;
    }
    decodeValue(r, f, path, rows, depth);
  }
}

function runDecoder(o) {
  const out = $('decodeOut');
  const hex = $('hexIn').value.replace(/0x/gi, '').replace(/[^0-9a-f]/gi, '');
  if (!hex.length || hex.length % 2) { out.innerHTML = '<p class="err">Need an even number of hex digits.</p>'; return; }
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
  const r = new Reader(bytes), rows = [];
  let err = null;
  try {
    if ($('hexHeader').checked) {
      const h = Number(r.varuint(32));
      const id = h & 0x3ff;
      rows.push({ off: 0, len: r.o, path: 'header', wire: 'varuint32', val: `id ${id}${id !== o.id ? ` (expected ${o.id}!)` : ''}` });
    }
    decodeFields(r, o.fields, '', rows, 0);
  } catch (e) { err = e.message; }
  let html = `<div class="table-wrap"><table class="inline"><thead><tr><th>Offset</th><th>Field</th><th>Wire</th><th>Value</th></tr></thead><tbody>`;
  for (const row of rows)
    html += `<tr><td>${row.off}</td><td>${esc(row.path)}</td><td class="ser">${esc(row.wire || '')}</td><td><code>${esc(row.val)}</code></td></tr>`;
  html += `</tbody></table></div>`;
  if (err) html += `<p class="err">Stopped: ${esc(err)}</p>`;
  else if (r.o < bytes.length) html += `<p class="err">${bytes.length - r.o} trailing byte(s) left over.</p>`;
  else html += `<p class="ok">Read all ${bytes.length} bytes.</p>`;
  out.innerHTML = html;
}

// ---- diff, ids, report -----------------------------------------------------------

function diffMarkdown(d, from, to) {
  let md = `## ${to.version} (protocol ${to.protocolVersion})\n\nChanges since ${from.version} (protocol ${from.protocolVersion}).\n`;
  for (const [label, cat] of CATS) {
    const c = d[cat];
    if (!c.added.length && !c.removed.length && !c.changed.length) continue;
    md += `\n### ${label}\n`;
    for (const n of c.added) md += `- added \`${n}\`\n`;
    for (const n of c.removed) md += `- removed \`${n}\`\n`;
    for (const ch of c.changed) {
      md += `- changed \`${ch.name}\`\n`;
      if (ch.type === 'fields') {
        if (ch.idChg) md += `  - id ${ch.oldId} → ${ch.newId}\n`;
        for (const f of ch.addedF) md += `  - \\+ \`${f.name}: ${f.type}\`\n`;
        for (const f of ch.removedF) md += `  - \\- \`${f.name}: ${f.type}\`\n`;
        for (const f of ch.changedF) md += `  - ~ \`${f.name}\`${f.typeReal ? `: ${f.from.type} → ${f.to.type}` : ''}${f.ordCh ? `, order ${f.from.order} → ${f.to.order}` : ''}${f.optCh ? `, now ${f.to.optional ? 'optional' : 'required'}` : ''}\n`;
      } else if (ch.type === 'values') {
        for (const v of ch.addedV) md += `  - \\+ \`${v}\`\n`;
        for (const v of ch.removedV) md += `  - \\- \`${v}\`\n`;
      }
    }
  }
  return md;
}

async function renderDiff() {
  state.current = null;
  renderSidebar();
  const content = $('content');
  const versions = state.versions;
  const idx = versions.findIndex(v => v.slug === state.slug);
  let baseSlug = state.baseSlug;
  if (!baseSlug || baseSlug === state.slug || !versions.some(v => v.slug === baseSlug))
    baseSlug = versions[idx + 1] ? versions[idx + 1].slug : null;
  const older = versions.filter(v => v.slug !== state.slug);
  const baseOpts = older.map(v =>
    `<option value="${esc(v.slug)}"${v.slug === baseSlug ? ' selected' : ''}>${esc(v.version)}</option>`).join('');
  let html = `<div class="diff-head"><h1>Changes</h1>`;
  if (older.length)
    html += `<span class="arrow">from</span><select id="baseSel">${baseOpts}</select>` +
            `<span class="arrow">&rarr; ${esc(state.data.version)}</span>`;
  html += `</div>`;
  if (!baseSlug) { content.innerHTML = html + '<div class="empty">No older version to compare.</div>'; return; }
  content.innerHTML = html + '<div class="empty">Loading terrain...</div>';
  const oldData = await getData(baseSlug), newData = state.data;
  if (state.view !== 'diff') return;
  if (!oldData) { content.innerHTML = html + '<div class="empty">Could not load the base build.</div>'; return; }
  const d = diffVersions(oldData, newData);
  let ta = 0, tr = 0, tc = 0;
  for (const [, cat] of CATS) { ta += d[cat].added.length; tr += d[cat].removed.length; tc += d[cat].changed.length; }
  html += `<p class="proto">protocol <b>${esc(oldData.protocolVersion)}</b> &rarr; <b>${esc(newData.protocolVersion)}</b></p>`;
  html += `<div class="toolrow"><span class="diff-sum"><span class="d-sub add"><b>${ta}</b> added</span>` +
          `<span class="d-sub rem"><b>${tr}</b> removed</span>` +
          `<span class="d-sub chg"><b>${tc}</b> changed</span></span>` +
          `<button class="mc-btn small" id="cpLink">Copy link</button>` +
          `<button class="mc-btn small" id="cpMd">Copy Markdown</button>` +
          `<button class="mc-btn small" id="cpJson">Copy JSON</button></div>`;
  if (!ta && !tr && !tc) html += '<div class="empty">No differences.</div>';
  for (const [label, cat] of CATS) {
    const c = d[cat];
    if (!c.added.length && !c.removed.length && !c.changed.length) continue;
    html += `<div class="diff-cat">${label}</div>`;
    for (const n of c.added)
      html += `<div class="d-add">+ <a href="${itemHref(n)}">${esc(n)}</a> <span class="tag">new</span></div>`;
    for (const n of c.removed)
      html += `<div class="d-rem">&minus; ${esc(n)} <span class="tag">removed</span></div>`;
    for (const ch of c.changed) {
      html += `<div class="d-chg">~ <a href="${itemHref(ch.name)}">${esc(ch.name)}</a>`;
      if (ch.type === 'fields') {
        if (ch.idChg) html += `<div class="d-sub chg">id ${esc(ch.oldId)} &rarr; ${esc(ch.newId)}</div>`;
        for (const f of ch.addedF) html += `<div class="d-sub add">+ ${esc(f.name)}: ${esc(f.type)}</div>`;
        for (const f of ch.removedF) html += `<div class="d-sub rem">&minus; ${esc(f.name)}: ${esc(f.type)}</div>`;
        for (const f of ch.changedF) {
          const parts = [];
          if (f.typeReal) parts.push(`${esc(f.from.type)} &rarr; ${esc(f.to.type)}`);
          if (f.ordCh) parts.push(`order ${esc(f.from.order)}&rarr;${esc(f.to.order)}`);
          if (f.optCh) parts.push(`${f.from.optional ? 'optional' : 'required'} &rarr; ${f.to.optional ? 'optional' : 'required'}`);
          html += `<div class="d-sub chg">~ ${esc(f.name)}: ${parts.join(', ')}</div>`;
        }
      } else if (ch.type === 'values') {
        for (const v of ch.addedV) html += `<div class="d-sub add">+ ${esc(v)}</div>`;
        for (const v of ch.removedV) html += `<div class="d-sub rem">&minus; ${esc(v)}</div>`;
      } else html += `<div class="d-sub chg">definition changed</div>`;
      html += `</div>`;
    }
  }
  content.innerHTML = html;
  // pin the base in the url so the link is shareable
  const want = `#${state.slug}/@diff/${baseSlug}`;
  if (location.hash !== want) history.replaceState(null, '', want);
  $('baseSel').onchange = e => { location.hash = `#${state.slug}/@diff/${e.target.value}`; };
  $('cpLink').onclick = e => copy(location.href, e.target);
  $('cpMd').onclick = e => copy(diffMarkdown(d, oldData, newData), e.target);
  $('cpJson').onclick = e => copy(JSON.stringify({ from: oldData.version, to: newData.version, ...d }, null, 2), e.target);
}

function renderIds() {
  state.current = null;
  renderSidebar();
  const packets = (state.data.packets || []).filter(p => p && p.id != null).sort((a, b) => a.id - b.id);
  let html = `<div class="kindrow"><h1>Packet IDs</h1><span class="badge"><b>${packets.length}</b> packets</span></div>` +
             `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Hex</th><th>Name</th><th>Direction</th><th>Fields</th></tr></thead><tbody>`;
  for (const p of packets) {
    const dir = directionOf(p);
    html += `<tr><td>${esc(p.id)}</td><td class="ser">0x${p.id.toString(16).padStart(2, '0')}</td>` +
            `<td><a href="${itemHref(p.name)}">${esc(p.name)}</a></td>` +
            `<td>${dir ? `<span class="dir dir-${dir}">${DIR_LABEL[dir]}</span>` : ''}</td>` +
            `<td class="ser">${(p.fields || []).length}</td></tr>`;
  }
  $('content').innerHTML = html + `</tbody></table></div>`;
}

function report(data) {
  let total = 0, resolved = 0;
  const unknownFields = [], emptyPackets = [], noDesc = [], noIds = [];
  for (const [, cat] of CATS) for (const o of data[cat] || []) {
    if (!o || !o.name) continue;
    for (const f of o.fields || []) {
      total++;
      if (isUnknown(f.type) || f.type === 'object') unknownFields.push(`${o.name}.${f.name}`);
      else resolved++;
    }
    if (o.kind === 'packet' && !(o.fields || []).length) emptyPackets.push(o.name);
    if (o.kind === 'packet' && !o.description) noDesc.push(o.name);
    if (o.kind === 'enum' && !o.valueIds) noIds.push(o.name);
  }
  return { total, resolved, coverage: total ? Math.floor(resolved / total * 1000) / 10 : 100, unknownFields, emptyPackets, noDesc, noIds };
}

function renderReport() {
  state.current = null;
  renderSidebar();
  const r = report(state.data);
  const section = (title, list, note) => {
    if (!list.length) return `<div class="diff-cat">${title} <span class="muted">0</span></div><p class="ok-ink">All good.</p>`;
    const links = list.map(n => {
      const item = n.split('.')[0];
      return state.index.has(item) ? `<a class="val link" href="${itemHref(item)}">${esc(n)}</a>` : `<span class="val">${esc(n)}</span>`;
    });
    return `<div class="diff-cat">${title} <span class="muted">${list.length}</span></div>` +
           (note ? `<p class="sub">${note}</p>` : '') + `<div class="vals">${links.join('')}</div>`;
  };
  $('content').innerHTML =
    `<div class="kindrow"><h1>Coverage</h1><span class="badge"><b>${r.coverage}%</b> of ${r.total} fields resolved</span></div>` +
    section('Unresolved field types', r.unknownFields, 'Type came out as unknown or a bare object in the schema dump.') +
    section('Packets without fields', r.emptyPackets, 'Usually means the payload schema was missing for this build.') +
    section('Packets without a description', r.noDesc) +
    section('Enums without numeric values', r.noIds, 'Older builds were published before value ids were exported.');
}

function clearDetail() {
  state.current = null;
  renderSidebar();
  $('content').innerHTML = '<div class="empty">Select an item from the sidebar.<br><span class="sub">Press / to search, try id:9, type:Vec3, kind:enum or dir:cs</span></div>';
}

// ---- small helpers ---------------------------------------------------------------

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  const old = btn.textContent;
  btn.textContent = 'Copied';
  setTimeout(() => { btn.textContent = old; }, 1200);
}

// ---- wiring ------------------------------------------------------------------------

$('diffBtn').onclick = () => { location.hash = state.view === 'diff' ? `#${state.slug}` : `#${state.slug}/@diff`; };
$('idsBtn').onclick = () => { location.hash = state.view === 'ids' ? `#${state.slug}` : `#${state.slug}/@ids`; };
$('search').oninput = renderSidebar;
window.addEventListener('hashchange', route);

// inline expansion of nested types, adds a row right under the clicked one
$('content').addEventListener('click', e => {
  const btn = e.target.closest('.expand');
  if (!btn) return;
  const tr = btn.closest('tr');
  const open = btn.getAttribute('aria-expanded') === 'true';
  const next = tr.nextElementSibling;
  if (open) {
    if (next && next.classList.contains('nested') && next.dataset.type === btn.dataset.type) next.remove();
    btn.setAttribute('aria-expanded', 'false'); btn.textContent = '+';
    return;
  }
  const row = document.createElement('tr');
  row.className = 'nested';
  row.dataset.type = btn.dataset.type;
  row.innerHTML = `<td></td><td colspan="${tr.children.length - 1}"><div class="nested-title">${esc(btn.dataset.type)}</div>${inlineBody(btn.dataset.type)}</td>`;
  tr.after(row);
  btn.setAttribute('aria-expanded', 'true'); btn.textContent = '−';
});

document.addEventListener('keydown', e => {
  const search = $('search');
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); search.focus(); search.select(); return; }
  if (e.key === 'Escape') { if (document.activeElement === search) search.blur(); setMenu(false); return; }
  if (typing && document.activeElement !== search) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveCursor(e.key === 'ArrowDown' ? 1 : -1); return; }
  if (e.key === 'Enter' && state.cursor >= 0) {
    const el = $('sidebar').querySelectorAll('.item')[state.cursor];
    if (el) { location.hash = el.getAttribute('href'); setMenu(false); }
  }
});

const sidebar = $('sidebar');
const menuBtn = $('menuBtn');
function setMenu(open) {
  sidebar.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
}
menuBtn.onclick = () => setMenu(!sidebar.classList.contains('open'));
// close the drawer once something got picked, otherwise it covers the page on phones
sidebar.addEventListener('click', e => { if (e.target.closest('.item')) setMenu(false); });

// title screen splash, purely cosmetic
const splashes = ['Now with diffs!', 'Little endian!', 'Varints everywhere!', 'Also try Java!', 'Not an official site!', 'RakNet inside!'];
$('splash').textContent = splashes[Math.floor(Math.random() * splashes.length)];

loadVersions();
</script>
